<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wet Paint Wordmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EFEDE6; --paper-2:#E7E4DB;
  --line:#2A2A26; --line-soft:rgba(42,42,38,.42);
  --paint:#1E1E1B; --wet:#B6B3A8; --accent:#E8471C;
  --text:#26261F; --muted:#77746A; --rule:rgba(42,42,38,.16); --focus:#E8471C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141513; --paper-2:#1B1C19;
    --line:#B9B6AA; --line-soft:rgba(185,182,170,.40);
    --paint:#EDEAE0; --wet:#4C4C45; --accent:#FF5A2B;
    --text:#DCD9CE; --muted:#8A877C; --rule:rgba(185,182,170,.16); --focus:#FF5A2B;
  }
}
:root[data-theme="dark"]{
  --paper:#141513; --paper-2:#1B1C19;
  --line:#B9B6AA; --line-soft:rgba(185,182,170,.40);
  --paint:#EDEAE0; --wet:#4C4C45; --accent:#FF5A2B;
  --text:#DCD9CE; --muted:#8A877C; --rule:rgba(185,182,170,.16); --focus:#FF5A2B;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--text);
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  -webkit-font-smoothing:antialiased;
}
.sheet{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:clamp(20px,5vw,64px) clamp(14px,4vw,56px);
}
.col{width:100%; max-width:1440px; display:flex; flex-direction:column; gap:clamp(14px,2vw,24px)}

/* ---------- stage ---------- */
.stage{
  position:relative; width:100%; height:clamp(190px,27vw,360px);
  cursor:none; touch-action:none; overflow:hidden; user-select:none;
}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage canvas.grey{opacity:.5}
.stage canvas.dry{opacity:.34}
.stage:focus-visible{outline:2px solid var(--focus);outline-offset:6px}

/* ---------- instruments ---------- */
.rack{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--rule);padding-top:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px clamp(14px,2.2vw,30px)}
.lbl{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.seg{display:flex;border:1px solid var(--line-soft)}
.seg button{
  font:inherit;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);background:transparent;border:0;border-right:1px solid var(--line-soft);
  padding:7px 11px;cursor:pointer;transition:background .15s ease,color .15s ease;
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--paint);color:var(--paper)}
.seg button:hover:not([aria-pressed="true"]){background:var(--paper-2);color:var(--text)}
.ctrl{display:flex;align-items:center;gap:9px}
.ctrl output{font-size:11px;color:var(--text);min-width:2.6ch;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:clamp(58px,6.6vw,96px);height:14px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line-soft)}
input[type=range]::-moz-range-track{height:1px;background:var(--line-soft)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:9px;height:9px;border-radius:0;background:var(--accent);margin-top:-4px;border:0}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:0;background:var(--accent);border:0}
input[type=text]{
  font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text);background:transparent;border:0;border-bottom:1px solid var(--line-soft);
  padding:5px 2px;width:13ch;
}
input:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.tog{
  font:inherit;font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);background:transparent;border:1px solid var(--line-soft);
  padding:7px 11px;cursor:pointer;transition:background .15s ease,color .15s ease;
}
.tog[aria-pressed="true"]{background:var(--paint);color:var(--paper);border-color:var(--paint)}
.tog:hover:not([aria-pressed="true"]){background:var(--paper-2);color:var(--text)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="sheet">
  <div class="col">

    <div class="stage" id="stage" tabindex="0" aria-label="Wordmark. Move the pointer across the letters to spread paint into them.">
      <canvas class="draft" id="cDraft"></canvas>
      <canvas class="grey" id="cGrey"></canvas>
      <canvas class="dry" id="cDry"></canvas>
      <canvas class="paint" id="cPaint"></canvas>
      <canvas class="over" id="cOver"></canvas>
    </div>

    <div class="rack">
      <div class="row">
        <span class="lbl">Ink</span>
        <div class="seg" id="styleSeg">
          <button type="button" data-style="bleed"    aria-pressed="true">Wet bleed</button>
          <button type="button" data-style="flood"    aria-pressed="false">Flood</button>
          <button type="button" data-style="dry"      aria-pressed="false">Dry brush</button>
          <button type="button" data-style="spray"    aria-pressed="false">Spray</button>
          <button type="button" data-style="scribble" aria-pressed="false">Scribble</button>
        </div>
        <span class="lbl">Word</span>
        <input id="word" type="text" value="HERON AI" spellcheck="false" aria-label="Wordmark text">
      </div>

      <div class="row">
        <div class="ctrl"><span class="lbl">Brush</span><input id="brush"  type="range" min="8"  max="80"  value="30"><output id="brushOut">30</output></div>
        <div class="ctrl"><span class="lbl">Flow</span><input  id="flow"   type="range" min="0"  max="100" value="58"><output id="flowOut">58</output></div>
        <div class="ctrl"><span class="lbl">Dry</span><input   id="dry"    type="range" min="0"  max="100" value="26"><output id="dryOut">26</output></div>
        <div class="ctrl"><span class="lbl">Rate</span><input  id="rate"   type="range" min="0"  max="100" value="34"><output id="rateOut">34</output></div>
        <div class="ctrl"><span class="lbl">Smooth</span><input id="smooth" type="range" min="0" max="100" value="45"><output id="smoothOut">45</output></div>
        <div class="ctrl"><span class="lbl">Edge</span><input  id="edge"   type="range" min="0"  max="100" value="45"><output id="edgeOut">45</output></div>
        <div class="ctrl"><span class="lbl">Drips</span><input id="drips"  type="range" min="0"  max="100" value="28"><output id="dripsOut">28</output></div>
        <div class="ctrl"><span class="lbl">Wet zone</span><input id="zone" type="range" min="10" max="60" value="26"><output id="zoneOut">2.6</output></div>
      </div>

      <div class="row">
        <button class="tog" id="tMarks" type="button" aria-pressed="true">Crop marks</button>
        <button class="tog" id="tRuler" type="button" aria-pressed="true">Ruler</button>
        <button class="tog" id="tCursor" type="button" aria-pressed="true">Cursor mark</button>
        <button class="tog" id="tDemo" type="button" aria-pressed="false">Self-paint</button>
        <button class="tog" id="reset" type="button">Wipe sheet</button>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  const stage  = document.getElementById('stage')
  const cDraft = document.getElementById('cDraft')
  const cGrey  = document.getElementById('cGrey')
  const cDry   = document.getElementById('cDry')
  const cPaint = document.getElementById('cPaint')
  const cOver  = document.getElementById('cOver')
  const xDraft = cDraft.getContext('2d')
  const xGrey  = cGrey.getContext('2d')
  const xDry   = cDry.getContext('2d')
  const xPaint = cPaint.getContext('2d')
  const xOver  = cOver.getContext('2d')

  // union masks: every live mark is filled opaque into these, so overlaps
  // never seam; the colour is applied once, to the finished union
  const maskP = document.createElement('canvas')
  const maskG = document.createElement('canvas')
  const maskD = document.createElement('canvas')
  const glyphFill = document.createElement('canvas')
  const xMP = maskP.getContext('2d')
  const xMG = maskG.getContext('2d')
  const xMD = maskD.getContext('2d')
  const xGF = glyphFill.getContext('2d')

  const FONT = '600 %spx Archivo, "Helvetica Neue", Arial, sans-serif'
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  const MAX_STAMPS = 520

  /* Everything the loop reads. Drop the control rack and these stay as defaults. */
  const CFG = {
    word:   'HERON AI',
    style:  'bleed',   // bleed | flood | dry | spray | scribble
    brush:  30,        // px, mark radius
    flow:   0.58,      // how far a mark bleeds past where it landed
    dry:    0.26,      // how soon ink starts to go (0 = never)
    rate:   0.34,      // how fast it goes once it starts
    smooth: 0.45,      // how much the brush tip lags and smooths the pointer
    edge:   0.45,      // 0 clean pool, 1 torn edge
    drips:  0.28,
    zone:   2.6,       // wet radius around the cursor, in brush widths
    marks:  true, ruler: true, cursor: true, demo: false, seed: true,
    tracking: 0.055
  }

  let W=0,H=0,DPR=1,fs=100,glyphs=[],baseline=0,C={}
  let stamps=[], strokeDir=0
  let last=null, target=null, pointer=null, inside=false
  let lastMoveAt=0, lastEmit=0, prevT=0, demoT=0

  function readTokens(){
    const s = getComputedStyle(document.documentElement)
    C = {
      line:  s.getPropertyValue('--line').trim(),
      paint: s.getPropertyValue('--paint').trim(),
      wet:   s.getPropertyValue('--wet').trim(),
      accent:s.getPropertyValue('--accent').trim()
    }
  }

  /* ---------- deterministic wobble ---------- */
  function rnd(seed){
    const v = Math.sin(seed*127.1 + 311.7) * 43758.5453
    return v - Math.floor(v)
  }

  function blobPath(ctx, cx, cy, rx, ry, seed, wob){
    const n = 13, pts = []
    for(let i=0;i<n;i++){
      const a = (i/n)*Math.PI*2
      const k  = 1 + (rnd(seed + i*3.37) - 0.42) * wob
      const k2 = 1 + (rnd(seed + i*7.11) - 0.5)  * wob * 0.55
      pts.push([cx + Math.cos(a)*rx*k, cy + Math.sin(a)*ry*k*k2])
    }
    ctx.beginPath()
    ctx.moveTo(pts[0][0], pts[0][1])
    for(let i=0;i<n;i++){
      const p0=pts[(i-1+n)%n], p1=pts[i], p2=pts[(i+1)%n], p3=pts[(i+2)%n]
      ctx.bezierCurveTo(
        p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6,
        p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6,
        p2[0], p2[1]
      )
    }
    ctx.closePath()
  }

  /* One mark, drawn five ways. Every style fills white into a union mask. */
  function drawShape(ctx, s, cx, cy, rx, ry, wob, seedOff){
    if(rx <= 0.3 || ry <= 0.3) return
    const seed = s.seed + seedOff
    switch(CFG.style){

      // smooth, high surface tension — a pool rather than a blot
      case 'flood':
        blobPath(ctx, cx, cy, rx, ry, seed, wob*0.3); ctx.fill(); break

      // broken streaks raked along the direction of travel
      case 'dry': {
        const n = 5
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(s.dir)
        for(let i=0;i<n;i++){
          if(rnd(seed + i*11.3) > 0.8) continue            // gaps in the bristle
          const t   = i/(n-1) - 0.5
          const off = t*ry*1.9
          const len = rx*(0.7 + rnd(seed + i*5.1)*0.8)
          const th  = ry*(0.08 + rnd(seed + i*3.7)*0.15)
          blobPath(ctx, (rnd(seed + i*2.3)-0.5)*rx*0.5, off, len, th, seed + i*13.1, wob*1.3)
          ctx.fill()
        }
        ctx.restore(); break
      }

      // airbrush speckle, denser at the centre
      case 'spray': {
        const n = Math.max(4, Math.min(28, Math.round(rx*0.6)))
        const squash = ry/rx
        for(let i=0;i<n;i++){
          const a  = rnd(seed + i*2.1)*Math.PI*2
          const rr = Math.pow(rnd(seed + i*4.7), 0.62)*rx*1.15
          const dr = Math.max(0.6, rx*(0.05 + rnd(seed + i*9.3)*0.13))
          ctx.beginPath()
          ctx.arc(cx + Math.cos(a)*rr, cy + Math.sin(a)*rr*squash, dr, 0, Math.PI*2)
          ctx.fill()
        }
        break
      }

      // marker scribble: one thick cross-stroke per mark
      case 'scribble': {
        const a = s.dir + Math.PI/2 + (rnd(seed)-0.5)*1.5
        ctx.save()
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'
        ctx.strokeStyle = ctx.fillStyle
        ctx.lineWidth = Math.max(1, ry*0.55)
        ctx.beginPath()
        ctx.moveTo(cx - Math.cos(a)*rx*1.35, cy - Math.sin(a)*ry*1.35)
        ctx.lineTo(cx + Math.cos(a)*rx*1.35, cy + Math.sin(a)*ry*1.35)
        ctx.stroke(); ctx.restore(); break
      }

      // wet bleed — the default blot
      default:
        blobPath(ctx, cx, cy, rx, ry, seed, wob); ctx.fill()
    }
  }

  const easeOut = p => 1 - Math.pow(1-p, 3)
  const wobble  = () => 0.14 + CFG.edge*0.36

  /* Dry  -> how long ink stays put before it starts to go (0 = never)
     Rate -> how long the going takes once it starts */
  const holdNow = () => CFG.dry <= 0 ? Infinity : 380 + Math.pow(1-CFG.dry, 1.7)*8200
  const fadeNow = () => 320 + Math.pow(1-CFG.rate, 1.6)*5400

  /* A mark bleeds outward, sits, then dries in three overlapping stages:
     the damp fringe lifts first, the core retracts off-centre with a crustier
     edge, and a pale stain outlives both. */
  function geom(s, now, hold, fade){
    const age  = now - s.born          // bleed clock: always runs
    const dage = age - s.pause         // dry clock: frozen inside the wet zone
    const p = s.dur<=0 ? 1 : Math.min(1, age/s.dur)
    const e = reduce ? 1 : easeOut(p)
    const r  = s.r0 + (s.r1 - s.r0)*e
    const ry = r*(1 + (s.ey-1)*e)
    const cy = s.y + s.dy*e
    if(!isFinite(hold)) return { r, ry, cy, q:0, gk:1, kP:1, kD:0, ox:0, oy:0, dead:false }

    const h = hold*s.jit
    let q = 0
    if(dage > h) q = Math.min(1, (dage - h)/(fade*s.jit))
    const gk = dage < h ? Math.min(1, (h - dage)/(h*0.22)) : Math.max(0, 1 - q*3.2)
    const kP = 1 - Math.pow(q, 0.72)   // core:  goes early
    const kD = 1 - Math.pow(q, 2.3)    // stain: goes last
    const pull = r*0.16*q
    return { r, ry, cy, q, gk, kP, kD, dead:q>=1,
             ox: Math.cos(s.ang)*pull, oy: Math.sin(s.ang)*pull }
  }

  function addStamp(x, y, now, dir){
    const brush = CFG.brush, flow = CFG.flow
    const r0 = brush*(0.52 + rnd(x*0.13 + y*0.31)*0.22)
    const canDrip = CFG.style === 'bleed' || CFG.style === 'flood'
    const drip = canDrip && rnd(x*0.7 + y*1.9 + now*0.001) > 1 - CFG.drips*0.1
    stamps.push({
      x, y, r0,
      r1: r0*(1.05 + flow*0.85),
      seed: (x*13.7 + y*7.3 + stamps.length*3.1) % 1000,
      born: now, pause: 0,
      dur: reduce ? 0 : 420 + flow*520,
      ey: drip ? 1.55 + flow*0.85 : 1,
      dy: drip ? r0*(0.45 + flow*0.75) : 0,
      gx: (rnd(x+3.1)-0.5)*brush*0.2,
      gy: (rnd(y+8.4)-0.4)*brush*0.2,
      jit: 0.86 + rnd(x*2.7 + y*5.3)*0.28,     // no two marks dry in lockstep
      ang: rnd(x*1.9 + y*0.7)*Math.PI*2,
      dir: dir === undefined ? strokeDir : dir
    })
    if(stamps.length > MAX_STAMPS) stamps.shift()
  }

  function strokeTo(x, y, now){
    if(!last){ last = {x,y}; addStamp(x,y,now); return }
    const dx = x-last.x, dy = y-last.y
    const d = Math.hypot(dx,dy)
    const step = Math.max(4, CFG.brush*0.32)
    if(d < step) return
    strokeDir = Math.atan2(dy,dx)
    const n = Math.min(20, Math.floor(d/step))
    for(let i=1;i<=n;i++)
      addStamp(last.x + dx*(i/n), last.y + dy*(i/n), now - (n-i)*5, strokeDir)
    last = {x,y}
  }

  /* ---------- blueprint ---------- */
  function measure(){
    const word = CFG.word || ' '
    xDraft.setTransform(DPR,0,0,DPR,0,0)
    const pad = W*0.055
    xDraft.font = FONT.replace('%s', 100)
    let w100 = 0
    for(const ch of word) w100 += xDraft.measureText(ch).width
    w100 += 100*CFG.tracking*(word.length-1)
    fs = Math.max(8, Math.min((W - pad*2)/(w100/100), H*0.78))

    const track = fs*CFG.tracking
    xDraft.font = FONT.replace('%s', fs)
    const widths = []
    let total = 0
    for(const ch of word){ const w = xDraft.measureText(ch).width; widths.push(w); total += w }
    total += track*(word.length-1)
    baseline = H/2 + xDraft.measureText('H').actualBoundingBoxAscent/2

    glyphs = []
    let x = (W-total)/2
    ;[...word].forEach((ch,i)=>{
      if(ch !== ' '){
        const mm = xDraft.measureText(ch)
        glyphs.push({
          ch, x,
          left:  x - mm.actualBoundingBoxLeft,
          right: x + mm.actualBoundingBoxRight,
          top:   baseline - mm.actualBoundingBoxAscent,
          bottom:baseline + mm.actualBoundingBoxDescent
        })
      }
      x += widths[i] + track
    })
  }

  const tick = (ctx,x1,y1,x2,y2)=>{ ctx.moveTo(x1,y1); ctx.lineTo(x2,y2) }

  function drawDraft(){
    xDraft.setTransform(DPR,0,0,DPR,0,0)
    xDraft.clearRect(0,0,W,H)
    xDraft.font = FONT.replace('%s', fs)
    xDraft.textBaseline = 'alphabetic'

    if(CFG.marks){
      const u = Math.max(6, fs*0.075), off = Math.max(4, fs*0.045)
      xDraft.strokeStyle = C.line; xDraft.lineWidth = 0.9; xDraft.globalAlpha = 0.62
      xDraft.beginPath()
      for(const g of glyphs){
        const {left:L, right:R, top:T, bottom:B} = g
        ;[[L,T,-1,-1],[R,T,1,-1],[L,B,-1,1],[R,B,1,1]].forEach(([px,py,sx,sy])=>{
          tick(xDraft, px, py - sy*off, px, py - sy*(off+u))
          tick(xDraft, px - sx*off, py, px - sx*(off+u), py)
        })
        const my=(T+B)/2, mx=(L+R)/2
        tick(xDraft, L-off, my, L-off-u*0.7, my)
        tick(xDraft, R+off, my, R+off+u*0.7, my)
        tick(xDraft, mx, T-off, mx, T-off-u*0.7)
        tick(xDraft, mx, B+off, mx, B+off+u*0.7)
        if('ORQ0'.includes(g.ch)){
          tick(xDraft, mx-u*0.34, my, mx+u*0.34, my)
          tick(xDraft, mx, my-u*0.34, mx, my+u*0.34)
        }
      }
      xDraft.stroke()
    }

    // outline letters, doubled faintly for a reprographic wobble
    xDraft.lineJoin = 'round'; xDraft.strokeStyle = C.line
    xDraft.lineWidth = 1.05; xDraft.globalAlpha = 0.92
    for(const g of glyphs) xDraft.strokeText(g.ch, g.x, baseline)
    xDraft.globalAlpha = 0.28; xDraft.lineWidth = 0.7
    for(const g of glyphs) xDraft.strokeText(g.ch, g.x + 0.55, baseline + 0.45)
    xDraft.globalAlpha = 1

    if(CFG.ruler){
      xDraft.strokeStyle = C.line; xDraft.globalAlpha = 0.34; xDraft.lineWidth = 0.8
      xDraft.beginPath()
      const y0 = H - 6
      for(let x=0; x<=W; x+=7) tick(xDraft, x, y0, x, y0 - (Math.round(x/7)%10===0 ? 6 : 3))
      xDraft.stroke(); xDraft.globalAlpha = 1
    }

    xGF.setTransform(DPR,0,0,DPR,0,0)
    xGF.clearRect(0,0,W,H)
    xGF.font = FONT.replace('%s', fs)
    xGF.textBaseline = 'alphabetic'
    xGF.fillStyle = '#000'
    for(const g of glyphs) xGF.fillText(g.ch, g.x, baseline)
  }

  /* ---------- frame ---------- */
  function tint(ctx, mask, color){
    ctx.setTransform(1,0,0,1,0,0)
    ctx.globalCompositeOperation = 'source-over'
    ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height)
    ctx.drawImage(mask,0,0)
    ctx.globalCompositeOperation = 'source-in'
    ctx.fillStyle = color
    ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height)
    ctx.globalCompositeOperation = 'destination-in'
    ctx.drawImage(glyphFill,0,0)          // ink can only live inside the letters
    ctx.globalCompositeOperation = 'source-over'
    ctx.setTransform(DPR,0,0,DPR,0,0)
  }

  function render(now){
    const hold = holdNow(), fade = fadeNow()
    const dt = Math.min(64, now - (prevT || now))
    prevT = now

    /* Nobody at the controls: trace the word by itself. */
    if(CFG.demo && !inside && glyphs.length){
      demoT += (dt/1000)*0.55
      const a = glyphs[0], z = glyphs[glyphs.length-1]
      const u = 0.5 - 0.5*Math.cos(demoT)
      target = { x: a.left + (z.right - a.left)*u, y: H/2 + Math.sin(demoT*2.3)*fs*0.22 }
      if(!pointer) pointer = { x:target.x, y:target.y }
    }
    const engaged = inside || (CFG.demo && !inside)

    /* The tip chases the raw pointer on an exponential ease and every mark is
       laid from the tip, so the stroke stays smooth whatever rate the pointer
       events arrive at. */
    if(engaged && target){
      if(!pointer) pointer = { x:target.x, y:target.y }
      const k = 1 - Math.exp(-dt / (1 + CFG.smooth*190))
      pointer.x += (target.x - pointer.x)*k
      pointer.y += (target.y - pointer.y)*k
      strokeTo(pointer.x, pointer.y, now)
    }

    /* Resting the cursor keeps feeding paint: the longer the dwell, the wider
       the pool creeps out from under it. */
    const settled = target && pointer && Math.hypot(target.x-pointer.x, target.y-pointer.y) < 1.5
    if(engaged && pointer && settled && now - lastMoveAt > 80 && now - lastEmit > 90){
      const d = Math.min(1, (now - lastMoveAt)/2600)
      const spread = CFG.brush*(0.22 + d*0.95)
      const a = rnd(now*0.0007)*Math.PI*2
      const rr = Math.sqrt(rnd(now*0.0013))*spread
      addStamp(pointer.x + Math.cos(a)*rr, pointer.y + Math.sin(a)*rr, now)
      lastEmit = now
    }

    const wetR = CFG.brush*CFG.zone
    const wob = wobble()
    ;[[xMP,maskP],[xMG,maskG],[xMD,maskD]].forEach(([c,cv])=>{
      c.setTransform(1,0,0,1,0,0)
      c.clearRect(0,0,cv.width,cv.height)
      c.setTransform(DPR,0,0,DPR,0,0)
      c.fillStyle = '#fff'
    })

    const keep = []
    for(let i=0;i<stamps.length;i++){
      const s = stamps[i]

      /* The wet zone travels with the cursor: marks inside it hold their dry
         clock, and one already going re-wets when passed over. */
      if(engaged && pointer){
        const dx = s.x - pointer.x, dy = s.y - pointer.y
        const d2 = dx*dx + dy*dy
        if(d2 < wetR*wetR){
          const k = 1 - d2/(wetR*wetR)
          s.pause = Math.min(now - s.born, s.pause + dt*k*1.6)
        }
      }

      const g = geom(s, now, hold, fade)
      if(g.dead) continue                     // oldest reach this first
      keep.push(s)

      if(g.gk > 0.02)
        drawShape(xMG, s, s.x+s.gx, g.cy+s.gy, g.r*1.13*g.gk, g.ry*1.11*g.gk, wob*1.45, 41.3)
      if(g.q > 0.01 && g.kD > 0.02)
        drawShape(xMD, s, s.x+g.ox, g.cy+g.oy, g.r*g.kD, g.ry*g.kD, wob + g.q*0.3, 9.7)
      if(g.r*g.kP > 0.4)
        drawShape(xMP, s, s.x+g.ox, g.cy+g.oy, g.r*g.kP, g.ry*g.kP, wob + g.q*0.55, 0)
    }
    stamps = keep

    tint(xGrey,  maskG, C.wet)
    tint(xDry,   maskD, C.paint)
    tint(xPaint, maskP, C.paint)

    xOver.setTransform(DPR,0,0,DPR,0,0)
    xOver.clearRect(0,0,W,H)
    if(CFG.cursor && pointer && engaged){
      xOver.fillStyle = C.accent
      xOver.fillRect(pointer.x-4.5, pointer.y-4.5, 9, 9)
    }
    requestAnimationFrame(render)
  }

  /* ---------- sizing + opening state ---------- */
  function seed(){
    stamps = []
    if(!CFG.seed || glyphs.length < 5) return
    const a = glyphs[3], b = glyphs[4]
    const y = (a.top + a.bottom)/2
    const now = performance.now()
    const x0 = a.left + (a.right-a.left)*0.35
    const x1 = b.right - (b.right-b.left)*0.10
    const n = 24
    for(let i=0;i<=n;i++){
      const t = i/n
      addStamp(x0 + (x1-x0)*t, y + Math.sin(t*4.1)*fs*0.16, now - 900 + t*760, 0)
    }
  }

  function resize(){
    const r = stage.getBoundingClientRect()
    W = Math.max(1, Math.round(r.width))
    H = Math.max(1, Math.round(r.height))
    DPR = Math.min(2, window.devicePixelRatio || 1)
    ;[cDraft,cGrey,cDry,cPaint,cOver,maskP,maskG,maskD,glyphFill].forEach(c=>{ c.width = W*DPR; c.height = H*DPR })
    ;[xGrey,xDry,xPaint,xOver,xMP,xMG,xMD,xGF].forEach(c=>c.setTransform(DPR,0,0,DPR,0,0))
    readTokens(); measure(); drawDraft(); seed()
  }

  /* ---------- input ---------- */
  const local = e => {
    const r = stage.getBoundingClientRect()
    return { x: e.clientX - r.left, y: e.clientY - r.top }
  }
  stage.addEventListener('pointerenter', e=>{
    inside = true; last = null
    target = local(e)
    pointer = { x:target.x, y:target.y }      // no lerp in from the last exit
    lastMoveAt = performance.now()
  })
  stage.addEventListener('pointerleave', ()=>{ inside = false; last = null; if(!CFG.demo) target = null })
  stage.addEventListener('pointermove', e=>{
    const p = local(e)
    if(!target || Math.hypot(p.x-target.x, p.y-target.y) > 0.6) lastMoveAt = performance.now()
    target = p; inside = true
  })
  stage.addEventListener('pointerdown', e=>{ stage.setPointerCapture(e.pointerId) })

  /* ---------- controls ---------- */
  document.getElementById('styleSeg').addEventListener('click', e=>{
    const b = e.target.closest('button[data-style]')
    if(!b) return
    CFG.style = b.dataset.style
    ;[...b.parentElement.children].forEach(x=>x.setAttribute('aria-pressed', String(x === b)))
  })

  const word = document.getElementById('word')
  word.addEventListener('input', ()=>{
    CFG.word = word.value.toUpperCase() || ' '
    measure(); drawDraft(); stamps = []
  })

  ;[['brush',1],['flow',100],['dry',100],['rate',100],['smooth',100],['edge',100],['drips',100]]
    .forEach(([k,div])=>{
      const input = document.getElementById(k), out = document.getElementById(k+'Out')
      const sync = ()=>{ CFG[k] = +input.value/div; out.value = input.value }
      input.addEventListener('input', sync); sync()
    })
  const zone = document.getElementById('zone'), zoneOut = document.getElementById('zoneOut')
  const zsync = ()=>{ CFG.zone = +zone.value/10; zoneOut.value = CFG.zone.toFixed(1) }
  zone.addEventListener('input', zsync); zsync()

  const toggle = (id, key, after) => {
    const b = document.getElementById(id)
    b.setAttribute('aria-pressed', String(CFG[key]))
    b.addEventListener('click', ()=>{
      CFG[key] = !CFG[key]
      b.setAttribute('aria-pressed', String(CFG[key]))
      if(after) after()
    })
  }
  toggle('tMarks','marks', drawDraft)
  toggle('tRuler','ruler', drawDraft)
  toggle('tCursor','cursor')
  toggle('tDemo','demo', ()=>{ if(!CFG.demo && !inside) target = null })
  document.getElementById('reset').addEventListener('click', ()=>{ stamps = [] })

  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ readTokens(); drawDraft() })
  let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(resize, 120) })

  ;(document.fonts && document.fonts.load ? document.fonts.load('600 100px Archivo').catch(()=>{}) : Promise.resolve())
    .then(()=> document.fonts ? document.fonts.ready : null)
    .then(()=>{ resize(); requestAnimationFrame(render) })
})()
</script>
</body>
</html>
