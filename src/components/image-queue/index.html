<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Queue — Drag or Step</title>
<style>
  :root{
    --bg:#c9c9c9;
    --ink:#111;
    --card-size:min(52vh, 74vw, 520px);
    --band:calc(var(--card-size) * 0.082);   /* peek height of each card behind */
    --shrink:0.79;                            /* scale ratio per depth step */
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
       font:400 13px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}

  /* ============ SECTION ============ */
  .queue-section{
    position:relative;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(48px,7vh,88px);
    overflow:hidden;
    background:var(--bg);
    user-select:none; -webkit-user-select:none;
    touch-action:pan-y;
    outline:none;
  }

  .queue-head{
    position:absolute; top:clamp(20px,4vh,44px); left:clamp(20px,4vw,56px);
    letter-spacing:.14em; text-transform:uppercase; font-size:11px; opacity:.55;
  }
  .queue-counter{
    position:absolute; left:clamp(20px,4vw,56px); top:50%; transform:translateY(-50%);
    font-size:13px; font-weight:600; letter-spacing:.04em; font-variant-numeric:tabular-nums;
  }
  .queue-counter span{opacity:.4}

  /* ============ STACK ============ */
  .queue-stage{
    position:relative;
    width:var(--card-size);
    height:var(--card-size);
    margin-top:calc(var(--band) * 3);
  }

  .qcard{
    position:absolute; inset:0;
    transform-origin:50% 50%;
    will-change:transform,opacity;
    backface-visibility:hidden;
    cursor:grab;
  }
  .qcard img{
    display:block; width:100%; height:100%; object-fit:cover;
    pointer-events:none; -webkit-user-drag:none;
    filter:grayscale(1) contrast(1.02);
  }
  .qcard.is-settling,
  .qcard.is-idle{
    transition:transform .62s cubic-bezier(.22,.85,.25,1), opacity .62s ease;
  }
  .qcard.is-dragging{cursor:grabbing; transition:none}
  .qcard.is-flying{transition:none; cursor:grabbing; pointer-events:none}
  .qcard.is-recycling{transition:opacity .5s ease .12s}
  /* declared last so it wins over .is-idle */
  .qcard.is-returning{
    transition:transform .8s cubic-bezier(.16,1,.3,1), opacity .4s ease;
    pointer-events:none;
  }

  .qcard figcaption{
    position:absolute; left:0; top:100%; margin-top:14px;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    opacity:0; transition:opacity .4s ease; white-space:nowrap;
  }
  .qcard[data-depth="0"] figcaption{opacity:.6}

  /* ============ NAV ============ */
  .queue-nav{display:flex; gap:10px; z-index:20}
  .queue-nav button{
    width:46px; height:46px; border-radius:50%;
    display:grid; place-items:center; padding:0;
    border:1px solid var(--ink); background:transparent; color:var(--ink);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:background-color .18s ease, color .18s ease, opacity .18s ease, transform .12s ease;
  }
  .queue-nav button:hover:not(:disabled){background:var(--ink); color:var(--bg)}
  .queue-nav button:active:not(:disabled){transform:scale(.94)}
  .queue-nav button:disabled{opacity:.3; cursor:default}
  .queue-nav svg{width:16px; height:16px}

  .queue-hint{
    position:absolute; bottom:clamp(16px,3vh,28px); left:50%; transform:translateX(-50%);
    letter-spacing:.14em; text-transform:uppercase; font-size:10px; opacity:.42;
    transition:opacity .4s ease; white-space:nowrap;
  }
  .queue-section.is-active .queue-hint{opacity:0}

  @media (prefers-reduced-motion:reduce){
    .qcard,.qcard.is-settling,.qcard.is-idle,.qcard.is-returning{transition-duration:.01ms !important}
  }
  @media (max-width:640px){
    :root{--card-size:min(46vh,80vw,400px)}
    .queue-section{gap:36px}
  }
</style>
</head>

(function(){
  const section = document.getElementById('queue');
  const stage   = document.getElementById('qStage');
  const numEl   = document.getElementById('qNum');
  const btnPrev = document.getElementById('qPrev');
  const btnNext = document.getElementById('qNext');
  const cards   = Array.from(stage.querySelectorAll('.qcard'));
  const N       = cards.length;

  /* --- tunables --- */
  const SHRINK      = 0.79;   // scale per depth step
  const OPACITY_FAL = 0.20;   // opacity lost per depth step
  const ROT_PER_PX  = 0.05;   // deg of tilt per px dragged
  const THROW_MIN   = 60;     // px of travel before a release counts as a throw
  const GRAVITY     = 2600;   // px/s^2 while falling
  const RETURN_MS   = 800;    // how long a card takes to climb back in

  let order    = cards.slice();   // order[0] === front card
  let dragging = null;
  let flying   = null;
  let returning = null;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const band = () => parseFloat(getComputedStyle(document.documentElement)
                      .getPropertyValue('--band')) || stage.offsetHeight * 0.082;

  /* Resting transform for a card at depth i.
     Each card behind peeks out by exactly one `band` above the one in front. */
  function restStyle(i){
    const H = stage.offsetHeight;
    const s = Math.pow(SHRINK, i);
    const ty = (H * (s - 1)) / 2 - i * band();
    return {
      transform: `translate3d(0, ${ty.toFixed(2)}px, 0) scale(${s.toFixed(4)})`,
      opacity  : Math.max(0, 1 - i * OPACITY_FAL),
      z        : N - i
    };
  }

  function layout(animate){
    order.forEach((card, i) => {
      if (card === flying) return;
      const st = restStyle(i);
      if (card !== returning) card.classList.toggle('is-idle', !!animate);
      card.dataset.depth = i;
      card.style.zIndex    = st.z;
      card.style.transform = st.transform;
      card.style.opacity   = st.opacity;
    });
    numEl.textContent = String(cards.indexOf(order[0]) + 1).padStart(2, '0');
    btnPrev.disabled = !!(flying && flying === order[N - 1]) || !!returning;
  }

  /* ---------- drag ---------- */
  function onDown(e){
    if (flying || dragging || returning) return;
    const front = order[0];
    if (!front.contains(e.target) && e.target !== front) return;

    section.classList.add('is-active');
    dragging = {
      card: front,
      x0: e.clientX, y0: e.clientY, x: 0, y: 0,
      lx: e.clientX, ly: e.clientY, lt: performance.now(), vx: 0, vy: 0
    };
    front.setPointerCapture(e.pointerId);
    front.classList.remove('is-idle','is-settling','is-returning');
    front.classList.add('is-dragging');
  }

  function onMove(e){
    if (!dragging) return;
    const d = dragging;
    d.x = e.clientX - d.x0;
    d.y = e.clientY - d.y0;

    const now = performance.now();
    const dt = Math.max(8, now - d.lt);
    d.vx = (e.clientX - d.lx) / dt * 1000;
    d.vy = (e.clientY - d.ly) / dt * 1000;
    d.lx = e.clientX; d.ly = e.clientY; d.lt = now;

    d.card.style.transform =
      `translate3d(${d.x}px, ${d.y}px, 0) rotate(${(d.x * ROT_PER_PX).toFixed(2)}deg) scale(1.015)`;
  }

  function onUp(){
    if (!dragging) return;
    const d = dragging;
    dragging = null;
    d.card.classList.remove('is-dragging');

    if (Math.hypot(d.x, d.y) < THROW_MIN){
      d.card.classList.add('is-settling');   // not far enough — snap back
      layout(true);
      return;
    }
    drop(d.card, d.x, d.y, d.vx, d.vy);
  }

  /* ---------- the drop: card falls out of frame, then rejoins at the back ---------- */
  function drop(card, x, y, vx, vy){
    flying = card;
    card.classList.remove('is-idle','is-settling','is-returning');
    card.classList.add('is-flying');
    card.style.zIndex = N + 5;

    let px = x, py = y;
    let svx = clamp(vx, -1400, 1400);
    let svy = Math.max(vy, 260) + 320;
    let rot = x * ROT_PER_PX;
    let vrot = clamp(vx, -1200, 1200) * 0.035 + (x >= 0 ? 26 : -26);
    let last = performance.now();
    const limit = innerHeight + stage.offsetHeight;

    order = order.slice(1).concat(card);   // the queue steps forward straight away
    card.dataset.depth = -1;               // drops its caption while it falls
    layout(true);

    if (reduce){ recycle(card); return; }

    (function frame(now){
      const dt = Math.min(0.032, (now - last) / 1000);
      last = now;
      svy += GRAVITY * dt;
      px += svx * dt; py += svy * dt; rot += vrot * dt;

      const fade = Math.max(0, 1 - Math.max(0, py - innerHeight * 0.25) / (innerHeight * 0.5));
      card.style.transform = `translate3d(${px.toFixed(1)}px, ${py.toFixed(1)}px, 0) rotate(${rot.toFixed(1)}deg)`;
      card.style.opacity = fade.toFixed(3);

      if (py < limit && fade > 0.01) requestAnimationFrame(frame);
      else recycle(card);
    })(performance.now());
  }

  function recycle(card){
    card.classList.remove('is-flying');
    const st = restStyle(N - 1);
    card.style.transition = 'none';        // snap to the tail pose while invisible…
    card.style.opacity = 0;
    card.style.transform = st.transform;
    card.style.zIndex = st.z;
    card.dataset.depth = N - 1;
    void card.offsetWidth;
    card.style.transition = '';
    card.classList.add('is-recycling');    // …then fade it back in at the tail
    card.style.opacity = st.opacity;
    setTimeout(() => card.classList.remove('is-recycling'), 700);

    flying = null;
    layout(false);
  }

  /* ---------- prev: the tail card climbs back up into the front ---------- */
  function bringBack(){
    if (dragging || returning) return;
    const card = order[N - 1];
    if (card === flying) return;           // still in the air — can't pull it back yet

    returning = card;
    order = [card].concat(order.slice(0, -1));

    const dir = Math.random() > 0.5 ? 1 : -1;
    card.classList.remove('is-idle','is-settling','is-recycling','is-flying');
    card.style.transition = 'none';
    card.style.zIndex = N + 5;
    card.style.transform =
      `translate3d(${dir * 70}px, ${innerHeight + stage.offsetHeight}px, 0) rotate(${dir * 34}deg)`;
    card.style.opacity = 0;
    void card.offsetWidth;
    card.style.transition = '';
    card.classList.add('is-returning');

    layout(true);                          // everyone (incl. this card) heads to its rest pose

    setTimeout(() => {
      card.classList.remove('is-returning');
      returning = null;
      layout(false);
    }, RETURN_MS + 40);
  }

  /* ---------- next / keyboard ---------- */
  function goNext(){
    if (flying || dragging || returning) return;
    const dir = Math.random() > 0.5 ? 1 : -1;
    drop(order[0], dir * 90, 16, dir * 380, 160);
  }

  stage.addEventListener('pointerdown', onDown);
  stage.addEventListener('pointermove', onMove);
  stage.addEventListener('pointerup', onUp);
  stage.addEventListener('pointercancel', onUp);
  btnNext.addEventListener('click', () => { section.classList.add('is-active'); goNext(); });
  btnPrev.addEventListener('click', () => { section.classList.add('is-active'); bringBack(); });
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); section.classList.add('is-active'); goNext(); }
    if (e.key === 'ArrowLeft'){ e.preventDefault(); section.classList.add('is-active'); bringBack(); }
  });
  addEventListener('resize', () => layout(false));

  function clamp(v,a,b){ return Math.min(b, Math.max(a, v)); }

  layout(false);
})();
</script>
</body>
</html>
