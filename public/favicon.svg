<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="MotionShelf">
  <!--
    Three columns of unequal height: the masonry shelf the gallery is built
    from, reduced to its silhouette. Only three shapes, 2px gaps and 6px bars,
    so it still reads as three distinct columns at 16px.
  -->
  <defs>
    <linearGradient id="lead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9db2ff"/>
      <stop offset="1" stop-color="#5d82ff"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1c"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#2e2e33"/>

  <!-- short, tall, mid — the stagger is the whole idea, so keep the heights far apart -->
  <rect x="5" y="12" width="6" height="12" rx="3" fill="#8e8e97"/>
  <rect x="13" y="5" width="6" height="22" rx="3" fill="url(#lead)"/>
  <rect x="21" y="9" width="6" height="15" rx="3" fill="#f2f2f4"/>
</svg>
